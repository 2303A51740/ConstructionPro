
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: constructpro-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://host.docker.internal:27017/constructionDB
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: constructpro-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
