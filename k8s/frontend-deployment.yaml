apiVersion: apps/v1
kind: Deployment
metadata:
  name: constructpro-frontend
  namespace: constructpro
  labels:
    app: constructpro-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: constructpro-frontend

  template:
    metadata:
      labels:
        app: constructpro-frontend

    spec:
      containers:
        - name: frontend
          image: construction-management-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"