apiVersion: apps/v1
kind: Deployment
metadata:
  name: constructpro-backend
  namespace: constructpro
  labels:
    app: constructpro-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: constructpro-backend

  template:
    metadata:
      labels:
        app: constructpro-backend

    spec:
      containers:
        - name: backend
          image: construction-management-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: constructpro-config
            - secretRef:
                name: constructpro-secret

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"